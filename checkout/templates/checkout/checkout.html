<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Sia Shop</title>
</head>
<body>
    <h1>Checkout</h1>

    <h2>Delivery Information</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Continue to Payment</button>
    </form>

    <p>
        <a href="{% url 'view_bag' %}">Return to Shopping Bag</a>
    </p>
</body>
</html>
