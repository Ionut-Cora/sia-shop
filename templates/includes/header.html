<header class="site-header">
    <div class="container">
        <div class="header-top">

            <!-- Brand -->
            <a href="{% url 'products' %}" class="brand-logo">SIA SHOP</a>

            <!-- Header icons -->
            <div class="header-actions">
                <a href="#header-search" class="header-icon" aria-label="Search products" title="Search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                </a>

                {% if request.user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="header-icon" aria-label="My profile" title="My Profile">
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                    </a>
                {% else %}
                    <a href="{% url 'account_login' %}" class="header-icon" aria-label="Login" title="Login">
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                    </a>
                {% endif %}

                <a href="{% url 'view_bag' %}" class="header-icon" aria-label="Shopping bag" title="Shopping Bag">
                    <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
                </a>
            </div>
        </div>

        <!-- Main navigation -->
        <nav class="main-navigation" aria-label="Main navigation">
            <ul class="navigation-links">
                <li>
                    <a href="{% url 'products' %}">Shop</a>
                </li>
                <li>
                    <a href="{% url 'products' %}?category=clothing">Clothing</a>
                </li>
                <li>
                    <a href="{% url 'products' %}?category=accessories">Accessories</a>
                </li>
                <li>
                    <a href="{% url 'products' %}?sale=true" class="sale-link">Sale</a>
                </li>
            </ul>
        </nav>

        <!-- Product search -->
        <form method="GET" action="{% url 'products' %}" class="header-search" role="search">
            <label for="header-search" class="visually-hidden">Search products</label>
            <input type="search" id="header-search" name="q" placeholder="Find something beautiful..." required>
            <button type="submit" aria-label="Submit product search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</header>
