<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Sia Shop</title>
</head>
<body>
    <h1>Our Products</h1>

    {% for product in products %}
        <div>
            {% if product.image %}
                <img src="{{ product.image.url }}"
                    alt="{{ product.name }}"
                    width="200">
            {% elif product.image_url %}
                <img src="{{ product.image_url }}"
                    alt="{{ product.name }}"
                    width="200">
            {% endif %}

            <a href="{% url 'product_detail' product.id %}">
                <h2>{{ product.name }}</h2>
            </a>
            <p>£{{ product.price }}</p>
        </div>
    {% empty %}
        <p>No products are available yet.</p>
    {% endfor %}
</body>
</html>
